name: encoder-comparison
dataset: ../caption_samples_50/all_samples.jsonl
output_dir: ../runs/models
seed: 42

transforms:
  - {name: identity}
  - {name: compact, label: compact_10w, max_words: 10}
  - {name: compact, label: compact_20w, max_words: 20}
  - {name: compact, label: compact_40w, max_words: 40}
  - {name: synonym, label: synonym_light, probability: 0.35, max_replacements: 4}
  - {name: clause_exchange}
  - {name: clause_reverse}
  - {name: color_change, domains: [person, vehicle], skip_unchanged: true}
  - {name: attribute_exchange, domains: [person, vehicle], skip_unchanged: true}
  - {name: negation, domains: [person, face], skip_unchanged: true}
  - {name: word_dropout, label: dropout_10pct, probability: 0.10}

# Add curated/LLM variants with: variant_files: [../variants/curated.jsonl]
models:
  - name: clip_b16
    backend: hf_text_features
    model_id: openai/clip-vit-base-patch16
    revision: refs/pr/16
    use_safetensors: true
    max_length: 77
    batch_size: 64
  - name: siglip2_b16_224
    backend: hf_text_features
    model_id: google/siglip2-base-patch16-224
    padding: max_length
    max_length: 64
    batch_size: 32
  - name: bge_m3
    backend: sentence_transformers
    model_id: BAAI/bge-m3
    batch_size: 16
  - name: multilingual_e5_large
    backend: sentence_transformers
    model_id: intfloat/multilingual-e5-large
    text_prefix: "query: "
    batch_size: 16
  # Diagnostic control only: not trained as a sentence/image retrieval encoder.
  - name: mdeberta_v3_base_control
    backend: hf_mean_pool
    model_id: microsoft/mdeberta-v3-base
    max_length: 512
    batch_size: 16

contrasts:
  - {reference: synonym_light, changed: color_change, label: synonym_minus_color_change}
  - {reference: synonym_light, changed: attribute_exchange, label: synonym_minus_attribute_exchange}
  - {reference: synonym_light, changed: negation, label: synonym_minus_negation}

