<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Görsel ve caption inceleme</title>
<style>
:root{color-scheme:light;--ink:#1a3038;--muted:#65757c;--line:#dbe3e6;--accent:#126e70}*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:var(--ink);font:15px/1.55 system-ui,sans-serif}header{padding:22px 30px;background:#153740;color:white}h1{font-size:25px;margin:0}header p{margin:6px 0;color:#cbdfe4}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}button,input,select{font:inherit}input,select{background:white;color:var(--ink);padding:9px;border:1px solid #bfcfd5;border-radius:8px;max-width:100%}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:8px 12px}button:hover{background:#e7f3f3}label{display:grid;gap:5px;font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:14px;flex-wrap:wrap;padding:16px 30px;background:white;border-bottom:1px solid var(--line)}.toolbar label:first-child{flex:1;min-width:230px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1700px;margin:auto}aside{padding:18px;border-right:1px solid var(--line);position:sticky;top:0;align-self:start;height:100vh;overflow:auto}.item{display:flex;gap:12px;width:100%;text-align:left;margin:8px 0;padding:8px;align-items:center}.item img{width:48px;height:58px;object-fit:contain;background:#eef1f3;border-radius:5px}.item.active{border:2px solid var(--accent);background:#e8f4f3}.item small{display:block;color:var(--muted)}main{padding:24px;min-width:0}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}.intro{display:grid;grid-template-columns:minmax(180px,310px) minmax(0,1fr);gap:24px}.hero{width:100%;height:340px;object-fit:contain;background:#edf1f3;border-radius:8px}.caption{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;padding:3px 8px;background:#edf2f5;border-radius:6px;font-size:12px;margin:0 5px 5px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compare-caption{padding:14px;background:#f6f9fa;border-radius:8px;margin-top:12px;max-height:330px;overflow:auto}.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.score{padding:15px;background:#edf6f5;border-radius:8px}.score b{font-size:28px;display:block;font-variant-numeric:tabular-nums}.track{height:6px;background:#d1e2e0;border-radius:4px;overflow:hidden;margin-top:10px}.track span{height:100%;display:block;background:var(--accent)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}th,td{padding:9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f6f9fa}details{background:white;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}summary{padding:15px;cursor:pointer;font-weight:600}.variant-body{padding:0 18px 18px}.warn{color:#a54c14}.diff-added{background:#b9efc6;color:#123e1d;padding:2px 4px;border:1px solid #42a65d;border-radius:4px;font-weight:700}.diff-removed{background:#ffd0ce;color:#8c1c18;padding:2px 4px;border:1px solid #d76863;border-radius:4px;text-decoration:line-through;font-weight:700}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}a{color:var(--accent)}.empty{padding:40px;text-align:center}
@media(max-width:900px){.layout{grid-template-columns:200px minmax(0,1fr)}.intro,.cols{grid-template-columns:1fr}main{padding:14px}.hero{height:280px}}@media(max-width:600px){.layout{display:block}aside{position:static;height:220px;border-right:0;border-bottom:1px solid var(--line)}header,.toolbar{padding:16px}.card{padding:15px}}
</style></head><body>
<header><h1>Görsel ve caption inceleme</h1><p>150 görsel · Orijinal metinler ve tüm kayıtlı varyantlar · İki caption arasında encoder karşılaştırması</p></header>
<div class="toolbar"><label>Deney<select id="run"><option value="priority">Ana deney — CLIP + SigLIP2 + MiniLM</option><option value="clip_b16">Ayrı CLIP B/16 deneyi</option><option value="quick">Hızlı deney — hash baseline + ek varyantlar</option></select></label><label>Kategori<select id="domain"><option value="all">Tümü</option><option value="person">İnsan</option><option value="face">Yüz</option><option value="vehicle">Araç</option></select></label><label>Görsel veya caption ara<input id="search" placeholder="Dosya adı, black jacket…" type="search"></label></div>
<div class="layout"><aside><div id="count" class="muted"></div><div id="list"></div></aside><main id="main"></main></div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const data=JSON.parse(document.getElementById('payload').textContent);
const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modelNames={clip_b16:'CLIP B/16',siglip2_b16_224:'SigLIP2 B/16',minilm_l6:'MiniLM L6',lexical_hash_baseline:'Lexical hash baseline'};
const labels={identity:'Orijinal caption',compact_10w:'Kısaltma · 10 kelime',compact_20w:'Kısaltma · 20 kelime',compact_40w:'Kısaltma · 40 kelime',synonym_light:'Eş anlamlı kelimeler',clause_reverse:'Parçaları ters sıralama',clause_exchange:'Parçaların sırasını döndürme',color_change:'Bir rengi değiştirme',attribute_exchange:'İlk iki rengi takas etme',negation:'Olumsuzlama',dropout_10pct:'Rastgele kelime silme · %10'};
const relations={same:'Orijinal',information_reduced:'Bilgi azaltma',semantic_preserving:'Anlamı koruma hedefi',semantic_changed:'Anlam değiştirme'};
Object.assign(labels,{summary_10w:'Gemini özeti · yaklaşık 10 kelime',summary_20w:'Gemini özeti · yaklaşık 20 kelime',summary_40w:'Gemini özeti · yaklaşık 40 kelime',llm_paraphrase:'Gemini · yeniden ifade',llm_synonym:'Gemini · bağlama uygun eş anlamlı',llm_attribute_order:'Gemini · özellik sıralaması',llm_negation:'Gemini · tek olguyu olumsuzlama',llm_color_change:'Gemini · tek renk değişikliği',llm_attribute_exchange:'Gemini · renk ilişkilerini takas',compact_10w:'Eski yöntem · 10 kelimeye parça seçme',compact_20w:'Eski yöntem · 20 kelimeye parça seçme',compact_40w:'Eski yöntem · 40 kelimeye parça seçme'});
function provenance(v){if(!v.generator?.startsWith('gemini:'))return '';return `<div class="compare-caption"><b>Gemini üretimi</b>${v.change_note?`<p>${esc(v.change_note)}</p>`:''}<span class="pill">${esc(v.generator)}</span>${v.retained_facts?.length?`<p><b>Modelin belirttiği korunan bilgiler:</b> ${v.retained_facts.map(x=>esc(x)).join(' · ')}</p>`:''}${v.omitted_facts?.length?`<p><b>Modelin belirttiği çıkarılan bilgiler:</b> ${v.omitted_facts.map(x=>esc(x)).join(' · ')}</p>`:''}</div>`}
const initialFile=decodeURIComponent(location.hash.slice(1));let selected=(data.samples.find(s=>s.filename===initialFile)||data.samples[0]).id,filtered=data.samples.slice(),aType='identity',bType=initialFile==='170623.jpg'?'negation':'compact_10w';
function getSample(){return data.samples.find(s=>s.id===selected)}
function getRun(){return data.runs[$('run').value]}
function getVariants(){return getRun().variants[selected]}
labels.llm_human_description='Gemini · günlük dilde insan tarifi';
function lengthInfo(v){const n=v.word_count??v.text.trim().split(/\s+/).length;return v.target_words?`<div class="muted"><b>Yaklaşık hedef: ${v.target_words} kelime · Gerçek uzunluk: ${n} kelime</b></div>`:v.type==='llm_human_description'?`<div class="muted"><b>Kelime hedefi verilmedi · Gerçek uzunluk: ${n} kelime</b></div>`:''}
function noScores(){return '<p class="warn">Encoder skorları henüz hesaplanmadı. Gemini caption üretiminden sonra encoder deneyini çalıştır. Şu anda benzerlik skoru yok.</p>'}
function reviewWarnings(v){return v.review_warnings?.length?`<p class="warn"><b>Üretim notları eksik veya tutarsız; caption'ı kaynakla karşılaştırarak incele.</b></p><ul class="muted">${v.review_warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
function configureRuns(){for(const [id,label] of [['gemini','Gemini özetleri — encoder skorları'],['gemini_pending','Gemini özetleri — skor bekleniyor']]){if(data.runs[id]){$('run').add(new Option(label,id));$('run').value=id}}if(!location.hash&&$('run').value.startsWith('gemini')){const first=data.samples.find(s=>getRun().variants[s.id]?.length>1);if(first)selected=first.id}}
function runNote(){return $('run').value.startsWith('gemini')?'Bu caption’lar Gemini ile üretilmiştir. 10/20/40 yaklaşık uzunluk hedefleridir; gerçekleşen kelime sayıları ayrıca gösterilir.':$('run').value==='quick'?'Bu deney yalnızca kelime örtüşmesini ölçen hash baseline kullanır.':'Bu geçmiş deneyde varyantlar kurallı dönüşümlerle üretilmiştir. Ek sıralama ve kelime silme varyantları hızlı deneyde bulunur.'}
function sampleComment(){if(getSample().filename!=='170623.jpg'||!['priority','clip_b16'].includes($('run').value))return '';const comments={identity:'Aynı metin karşılaştırılıyor; yaklaşık 1 beklenir.',compact_10w:'Yalnızca başlangıçtaki kişi ve yüz şekli bilgileri kalıyor. Detay kaybı var; orijinal de uzunluk sınırı nedeniyle zaten kısmen işleniyor.',compact_20w:'10 kelimelik versiyona göre daha fazla yüz bilgisi korunuyor. Daha yüksek benzerlik bu bilgi örtüşmesiyle tutarlı.',compact_40w:'Başlangıçtaki yüz/çene/saç çizgisi bilgileri daha çok korunuyor. 61 token ile tamamı işleniyor; 304 tokenlık orijinalin ise yalnızca başlangıcı görülüyor.',synonym_light:'Az sayıda kelime değişikliği var; ortak içerik büyük ölçüde aynı. Yüksek skor anlam eşdeğerliğinin kanıtı değildir.',clause_reverse:'Sondaki ışık, arka plan ve poz bilgileri başa taşınıyor. İki metin de kesildiğinden CLIP farklı içerik bölümlerini görüyor; sıra etkisi ve kesilme etkisi birlikte ölçülüyor.',negation:'Başlangıçta “with an oval facial shape” → “without an oval facial shape”. Değişiklik CLIP’in gördüğü bölümde. Yüksek cosine, bu olumsuzlamanın embedding yönünü az değiştirdiğini gösterir; metinlerin aynı anlamda olduğunu göstermez.'};return `<section class="card"><h2>170623.jpg · CLIP skorlarını nasıl okumalı?</h2><p><b>Olumsuzlamada gerçekten değişen kelime: <mark class="diff-removed">with</mark> → <mark class="diff-added">without</mark>.</b> “Oval yüz şekli olan” ifadesi “oval yüz şekli olmayan” yapılmış.</p><p>Orijinal metin 304 token; bu deneyde CLIP sınırı 77 token (özel tokenlar dahil). Skor, caption'ın tamamının veya görsel ile caption eşleşmesinin değerlendirmesi değildir.</p><div class="tablewrap"><table><thead><tr><th>Varyant</th><th>Cosine</th><th>Sıra</th><th>Örneğe ilişkin yorum</th></tr></thead><tbody>${getVariants().filter(v=>v.scores.clip_b16).map(v=>`<tr><td>${esc(labels[v.type]||v.type)}</td><td>${fmt(v.scores.clip_b16.cosine)}</td><td>${v.scores.clip_b16.rank}/50</td><td style="white-space:normal;min-width:250px">${esc(comments[v.type]||'')}</td></tr>`).join('')}</tbody></table></div><p class="muted">Bunlar kayıtlı sonuçlara ve uygulanan kesilme işlemine dayanan yorumlardır; modelin iç nedenlerini tek deneyle kesinleştiremeyiz. CLIP görüntü–metin eşleştirme amacıyla eğitilir; cosine mantıksal çelişkiyi ölçen bir doğruluk testi değildir. <a href="https://github.com/openai/CLIP/blob/main/model-card.md" target="_blank" rel="noopener">CLIP model kartı</a> · <a href="https://huggingface.co/docs/transformers/model_doc/clip" target="_blank" rel="noopener">CLIP teknik dokümantasyonu</a></p></section>`}
function options(vs,type){return vs.map(v=>`<option value="${esc(v.type)}" ${v.type===type?'selected':''}>${esc(labels[v.type]||v.type)}</option>`).join('')}
function fmt(n){return Number(n).toFixed(4)}
function diffParts(oldText,newText){const a=oldText.trim().split(/\s+/),b=newText.trim().split(/\s+/),dp=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0;const parts=[];while(i<a.length||j<b.length){if(i<a.length&&j<b.length&&a[i]===b[j]){parts.push({kind:'same',word:a[i++]});j++}else if(j<b.length&&(i===a.length||dp[i][j+1]>=dp[i+1][j]))parts.push({kind:'add',word:b[j++]});else parts.push({kind:'remove',word:a[i++]})}return parts}
function diffView(oldText,newText){const parts=diffParts(oldText,newText),removed=parts.filter(p=>p.kind==='remove'),added=parts.filter(p=>p.kind==='add');let groups=[],group=null;for(const p of parts){if(p.kind==='same'){if(group){groups.push(group);group=null}}else{group??={remove:[],add:[]};group[p.kind].push(p.word)}}if(group)groups.push(group);const side=kind=>parts.filter(p=>p.kind==='same'||p.kind===kind).map(p=>p.kind==='same'?esc(p.word):`<mark class="diff-${kind==='add'?'added':'removed'}">${esc(p.word)}</mark>`).join(' ');return {a:side('remove'),b:side('add'),html:groups.length?`<p><b>${removed.length} kelime çıkarıldı · ${added.length} kelime eklendi</b></p><div class="tablewrap"><table><thead><tr><th>A'dan çıkarılan</th><th>B'ye eklenen</th></tr></thead><tbody>${groups.map(g=>`<tr><td style="white-space:normal;min-width:150px"><mark class="diff-removed">${esc(g.remove.join(' '))||'—'}</mark></td><td style="white-space:normal;min-width:150px"><mark class="diff-added">${esc(g.add.join(' '))||'—'}</mark></td></tr>`).join('')}</tbody></table></div>`:'<p class="warn"><b>Seçilen iki caption birebir aynı. Değişiklik yok.</b> A veya B seçimini kontrol et.</p>'}}
function scoreTable(vs){const r=getRun();if(!r.models.length)return noScores();return `<div class="tablewrap"><table><thead><tr><th>Encoder</th><th>Caption</th><th>Orijinale cosine</th><th>Sıra / havuz</th><th>Margin</th><th>Token (orijinal → varyant)</th><th>Metin kesildi mi?</th></tr></thead><tbody>${vs.flatMap(v=>r.models.map(m=>{const s=v.scores[m];if(!s)return '';return `<tr><td>${esc(modelNames[m]||m)}</td><td>${esc(labels[v.type]||v.type)}</td><td>${fmt(s.cosine)}</td><td>${s.rank} / ${s.retrieval_pool_size}</td><td>${fmt(s.margin)}</td><td>${s.original_tokens} → ${s.variant_tokens}</td><td class="${s.original_truncated||s.variant_truncated?'warn':''}">Orijinal: ${s.original_truncated?'evet':'hayır'} · Varyant: ${s.variant_truncated?'evet':'hayır'}</td></tr>`})).join('')}</tbody></table></div>`}
function renderList(){const q=$('search').value.toLowerCase().trim(),d=$('domain').value;filtered=data.samples.filter(s=>(d==='all'||s.domain===d)&&(!q||[s.filename,s.original,...getRun().variants[s.id].map(v=>v.text)].join(' ').toLowerCase().includes(q)));$('count').textContent=`${filtered.length} / ${data.samples.length} görsel`;
if(!filtered.some(s=>s.id===selected))selected=filtered[0]?.id||null;
$('list').innerHTML=filtered.map(s=>`<button class="item ${s.id===selected?'active':''}" data-id="${esc(s.id)}"><img loading="lazy" src="${s.image}" alt=""><span>${esc(s.filename)}<small>${esc(s.domain)} · ${esc(s.split)}</small></span></button>`).join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.id));renderMain()}
function choose(id){selected=id;document.querySelectorAll('.item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));renderMain()}
function renderMain(){if(!selected){$('main').innerHTML='<div class="empty">Aramaya uygun görsel bulunamadı.</div>';return}const s=getSample(),vs=getVariants();if(!vs.some(v=>v.type===aType))aType='identity';if(!vs.some(v=>v.type===bType))bType=vs[1]?.type||'identity';const idx=filtered.findIndex(x=>x.id===selected);
$('main').innerHTML=`<div class="nav"><button id="prev" ${idx<=0?'disabled':''}>← Önceki</button><span class="muted">${idx+1} / ${filtered.length}</span><button id="next" ${idx>=filtered.length-1?'disabled':''}>Sonraki →</button></div><section class="card intro"><a href="${s.image}" target="_blank" title="Görseli büyüt"><img class="hero" src="${s.image}" alt="${esc(s.filename)}"></a><div><h2>${esc(s.filename)}</h2><span class="pill">${esc(s.domain)}</span><span class="pill">${esc(s.split)}</span><span class="pill">${vs.length-1} varyant</span><h3>Orijinal caption</h3><div class="caption">${esc(s.original)}</div></div></section>
<section class="card"><h2>İki caption seç ve karşılaştır</h2><div class="cols"><div><label>Caption A<select id="a">${options(vs,aType)}</select></label><div id="aText" class="caption compare-caption"></div></div><div><label>Caption B<select id="b">${options(vs,bType)}</select></label><div id="bText" class="caption compare-caption"></div></div></div><div id="pairScores" class="score-grid"></div><p class="muted">Bu skorlar seçtiğin A ve B metinlerinin doğrudan cosine benzerliğidir. 1'e yakın değer daha yüksek benzerlik gösterir. Farklı model ailelerinin ham cosine değerleri ortak bir ölçek değildir.</p><details open><summary>A → B kelime değişikliklerini göster</summary><div id="diff" class="variant-body caption"></div><p class="variant-body muted">Yeşil: eklenen · Üzeri çizili kırmızı: çıkarılan. Kelime sırası değişiklikleri de ekleme/çıkarma olarak görünebilir.</p></details><div id="selectedScores"></div><p class="muted">Orijinale cosine: caption'ın kendi orijinaline benzerliği. Sıra: kendi orijinalini aynı kategorideki 50 caption içinde kaçıncı bulduğu (1 en iyi). Margin: doğru orijinalin skoru − en benzer yanlış caption'ın skoru. Token sınırı aşılınca encoder metnin tamamını görmez.</p></section>
${sampleComment()}<section><h2>Bu görsele ait tüm caption'lar</h2><div class="actions" style="margin-bottom:12px"><button id="expand">Tümünü aç</button><button id="collapse">Tümünü kapat</button></div><div id="variants">${vs.map((v,i)=>`<details ${v.type==='identity'?'open':''}><summary>${esc(labels[v.type]||v.type)} <span class="pill">${esc(relations[v.relation]||v.relation)}</span>${v.type!=='identity'&&v.text===s.original?'<span class="pill">Metin değişmemiş</span>':''}</summary><div class="variant-body"><div class="caption">${v.type==='identity'?esc(v.text):diffView(s.original,v.text).b}</div>${v.type==='identity'?'':diffView(s.original,v.text).html}<div class="actions"><button data-compare="${i}">Orijinal ile kar&#351;&#305;la&#351;t&#305;r</button><button data-a="${i}">A olarak seç</button><button data-b="${i}">B olarak seç</button></div>${lengthInfo(v)}${provenance(v)}${scoreTable([v])}</div></details>`).join('')}</div></section><p class="muted">${runNote()}</p>`;
$('prev').onclick=()=>choose(filtered[idx-1].id);$('next').onclick=()=>choose(filtered[idx+1].id);$('a').onchange=()=>{aType=$('a').value;renderComparison()};$('b').onchange=()=>{bType=$('b').value;renderComparison()};$('expand').onclick=()=>document.querySelectorAll('#variants details').forEach(d=>d.open=true);$('collapse').onclick=()=>document.querySelectorAll('#variants details').forEach(d=>d.open=false);document.querySelectorAll('[data-a],[data-b],[data-compare]').forEach(btn=>btn.onclick=()=>{if(btn.dataset.compare!==undefined){aType='identity';bType=vs[+btn.dataset.compare].type;$('a').value=aType;$('b').value=bType}else if(btn.dataset.a!==undefined){aType=vs[+btn.dataset.a].type;$('a').value=aType}else{bType=vs[+btn.dataset.b].type;$('b').value=bType}renderComparison();$('a').scrollIntoView({behavior:'smooth',block:'center'})});renderComparison()}
function renderComparison(){const vs=getVariants(),ai=vs.findIndex(v=>v.type===aType),bi=vs.findIndex(v=>v.type===bType),a=vs[ai],b=vs[bi];const diff=diffView(a.text,b.text);$('aText').innerHTML=lengthInfo(a)+diff.a;$('bText').innerHTML=lengthInfo(b)+diff.b;$('diff').innerHTML=diff.html;$('pairScores').innerHTML=!getRun().models.length?noScores():getRun().models.map(m=>{const score=getRun().pairs[selected][m][ai][bi];return `<div class="score"><span>${esc(modelNames[m]||m)}</span><b>${fmt(score)}</b><small>A ↔ B cosine</small><div class="track"><span style="width:${Math.max(0,Math.min(100,100*score))}%"></span></div></div>`}).join('');$('selectedScores').innerHTML=provenance(a)+(ai===bi?'':provenance(b))+scoreTable(ai===bi?[a]:[a,b])}
configureRuns();
['run','domain'].forEach(id=>$(id).onchange=renderList);$('search').oninput=renderList;renderList();
</script></body></html>
